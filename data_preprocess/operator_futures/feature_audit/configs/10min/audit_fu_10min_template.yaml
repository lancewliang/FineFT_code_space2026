schema_version: multi_horizon_audit.v1
protocol_version: multi_horizon_audit.research.v1
symbol: fu
frequency: 10min
horizons:
  - 1h
  - 2h
  - 4h
  - today
  - next_td
  - next_5td
  - next_15td
hour_clock: active_trading_minutes
trading_day_offsets:
  today: 0
  next_td: 1
  next_5td: 5
  next_15td: 15
contract_policy: same_contract
candidate_policy: causal_quality_only
targets:
  - return
  - abs_return

# 输入 Manifest 路径（运行前请指定实际路径）
calendar_manifest: PREPROCESS_DATASET/commodity-futures/SPLIT-TRAIN-VALID-TEST/10min/fu/train/calendar_manifest.json
feature_availability_manifest: data_preprocess/operator_futures/feature_audit/configs/10min/feature_availability_manifest.json
price_source_manifest: data_preprocess/operator_futures/feature_audit/configs/10min/price_source_manifest.json
split_manifest: PREPROCESS_DATASET/commodity-futures/SPLIT-TRAIN-VALID-TEST/10min/fu/dataset_split_manifest.json

# 隔离与输出配置
read_final_test: false
purge_by_label_available_at: true
write_selection_outputs: false
result_root: analysis_result/DiHFT/feature_horizon_audit/fu/10min

reference_price_protocol:
  field: close
  observation: latest_valid_snapshot_at_or_before_target
  same_contract: true
  same_session: true
  max_quote_age_seconds: 600
  fallback: none

evidence_protocol:
  method: joint_trading_day_moving_block_bootstrap
  confidence_level: 0.95
  replicates: 2000
  seed: 42
  minimum_block_trading_days: 20
  respect_max_label_trading_day_span: true
  sensitivity_block_multiplier: 2
  minimum_effective_blocks: 20
  minimum_contracts_for_sign_consistency: 3
  multiple_comparison_adjustment: none_exploratory_only
  automatic_pass_list: false
